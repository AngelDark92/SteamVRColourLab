name: Build and release

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  COLOURLAB_OUTPUT_ROOT: ${{ github.workspace }}/../builds/SteamVRColourLab
  PYTHONDONTWRITEBYTECODE: '1'

permissions:
  contents: read

# Serialize main releases. Pending runs may coalesce; versioning includes every
# commit since the last successful tag, so their version intent is preserved.
# Superseded pull request runs are cancelled to keep the queue short.
concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The full unittest suite is the local push gate (.githooks/pre-push and
# test_windows.bat; see AGENTS.md), so hosted runners no longer repeat it. CI
# keeps the cleanup and version-integrity checks the portable build depends on,
# then builds, verifies and publishes the exact commit it was given.
jobs:
  windows:
    name: Portable Windows x64
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
      - name: Check agent instructions
        run: python -m unittest tests.test_agent_docs -v
      - name: Test Windows cleanup and data preservation
        run: python -m unittest tests.test_build_cleanup -v
      - name: Calculate and stamp release version
        id: version
        run: |
          python tools/release_policy.py --output "$env:COLOURLAB_OUTPUT_ROOT/build/release-plan.json" --stamp --github-output "$env:GITHUB_OUTPUT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable package
        run: |
          ./tools/Build-Portable.ps1 -Python (Get-Command python).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check ZIP, checksum, metadata and relocated executable
        run: python tools/verify_package.py --plan "$env:COLOURLAB_OUTPUT_ROOT/build/release-plan.json"
      # upload-artifact only accepts patterns inside the workspace without "..",
      # so the canonical external build/ + dist/ output is copied into a
      # workspace staging folder for transport and keeps that layout there.
      - name: Stage release artifacts for upload
        run: |
          $staging = Join-Path $env:GITHUB_WORKSPACE 'ci-artifacts'
          New-Item -ItemType Directory -Path (Join-Path $staging 'dist') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $staging 'build') -Force | Out-Null
          Copy-Item "$env:COLOURLAB_OUTPUT_ROOT/dist/SteamVRColourLab-Windows-x64.zip" -Destination (Join-Path $staging 'dist')
          Copy-Item "$env:COLOURLAB_OUTPUT_ROOT/dist/SteamVRColourLab-Windows-x64.zip.sha256" -Destination (Join-Path $staging 'dist')
          Copy-Item "$env:COLOURLAB_OUTPUT_ROOT/build/release-plan.json" -Destination (Join-Path $staging 'build')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SteamVRColourLab-${{ steps.version.outputs.version }}-Windows-x64
          path: |
            ci-artifacts/dist/SteamVRColourLab-Windows-x64.zip
            ci-artifacts/dist/SteamVRColourLab-Windows-x64.zip.sha256
            ci-artifacts/build/release-plan.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish verified release
    needs: windows
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.windows.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: SteamVRColourLab-${{ needs.windows.outputs.version }}-Windows-x64
          path: ci-artifacts
      - name: Publish exact tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python -m tools.publish_release --artifacts "$GITHUB_WORKSPACE/ci-artifacts"
