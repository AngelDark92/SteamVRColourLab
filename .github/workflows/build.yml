name: Build and release

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  COLOURLAB_OUTPUT_ROOT: ${{ github.workspace }}/../builds/SteamVRColourLab
  PYTHONDONTWRITEBYTECODE: '1'

permissions:
  contents: read

# Serialize main releases. Pending runs may coalesce; versioning includes every
# commit since the last successful tag, so their version intent is preserved.
concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests and version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      EGL_PLATFORM: surfaceless
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Install renderer and UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri libglx-mesa0 xvfb xauth python3-tk
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Run all tests with real software rendering
        run: xvfb-run -a python -m unittest discover -v
      - name: Calculate version
        id: version
        run: python tools/release_policy.py --output "$COLOURLAB_OUTPUT_ROOT/build/release-plan.json" --github-output "$GITHUB_OUTPUT"

  windows:
    name: Portable Windows x64
    needs: test
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      EXPECTED_VERSION: ${{ needs.test.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
      - name: Test Windows cleanup and data preservation
        run: python -m unittest tests.test_build_cleanup -v
      - name: Stamp and build portable package
        run: |
          python tools/release_policy.py --output "$env:COLOURLAB_OUTPUT_ROOT/build/release-plan.json" --stamp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $plan = Get-Content "$env:COLOURLAB_OUTPUT_ROOT/build/release-plan.json" -Raw | ConvertFrom-Json
          if ($plan.version -ne $env:EXPECTED_VERSION) { throw 'Version changed after tests; rerun this workflow.' }
          ./tools/Build-Portable.ps1 -Python (Get-Command python).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check ZIP, checksum, metadata and relocated executable
        run: python tools/verify_package.py --plan "$env:COLOURLAB_OUTPUT_ROOT/build/release-plan.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SteamVRColourLab-${{ needs.test.outputs.version }}-Windows-x64
          path: |
            ${{ env.COLOURLAB_OUTPUT_ROOT }}/dist/SteamVRColourLab-Windows-x64.zip
            ${{ env.COLOURLAB_OUTPUT_ROOT }}/dist/SteamVRColourLab-Windows-x64.zip.sha256
            ${{ env.COLOURLAB_OUTPUT_ROOT }}/build/release-plan.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish verified release
    needs: [test, windows]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.test.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: SteamVRColourLab-${{ needs.test.outputs.version }}-Windows-x64
          path: ${{ env.COLOURLAB_OUTPUT_ROOT }}/release-artifacts
      - name: Publish exact tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python -m tools.publish_release --artifacts "$COLOURLAB_OUTPUT_ROOT/release-artifacts"
